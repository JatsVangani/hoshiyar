[project]
name = "hoshiyar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JatsVangani", email = "jamesvangani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pipecat-ai[google,local,openai,sarvam,websocket]>=1.14.0",
    "python-dotenv>=1.2.4",
    "twilio>=9.12.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    "onnxruntime==1.23.2",
    "numba==0.62.1",
    "llvmlite==0.45.1",
]
