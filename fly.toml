# Fly.io config for Hoshiyar: one always-on machine in Mumbai, the data files on a volume.
app = "hoshiyar"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "Asia/Kolkata"
  ROSTER_FILE = "/data/drivers.json"
  SCHEDULE_FILE = "/data/schedule.json"
  CALLS_FILE = "/data/calls.jsonl"
  TRIALS_FILE = "/data/trials.json"

[[mounts]]
  source = "hoshiyar_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "off"     # the scheduler must stay awake all night
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/fleet"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"

swap_size_mb = 512
